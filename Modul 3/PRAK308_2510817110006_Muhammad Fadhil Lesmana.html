<html>

<head>
    <title> Pendaftaran Kursus </title>
</head>

<body bgcolor="#dddddd">

    <table border="1" width="600" align="center" cellspacing="0">

        <tr bgcolor="#87CEEB">
            <td colspan="2" align="center">
                <h1 style="color:red; font-family: Arial;"> Pendaftaran Kursus </h1>
            </td>
        </tr>

        <tr bgcolor="#808080">
            <td colspan="2">
                <h2>Data Diri</h2>

                <form>
                    <table>
                        <tr>
                            <td>Nama</td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>Nim</td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td>E-mail</td>
                            <td><input type="email"></td>
                        </tr>
                        <tr>
                            <td>Tanggal Lahir</td>
                            <td><input type="text" placeholder="hh/bb/tttt"></td>
                        </tr>
                        <tr>
                            <td>Jenis Kelamin</td>
                            <td>
                                <input type="radio" name="jk"> Laki-laki <br>
                                <input type="radio" name="jk"> Perempuan
                            </td>
                        </tr>
                        <tr>
                            <td valign="top"> Pilih Program Kursus </td>
                            <td>
                                <input type="checkbox"> C# <br>
                                <input type="checkbox"> Java <br>
                                <input type="checkbox"> SQL <br>
                                <input type="checkbox"> HTML dan PHP
                            </td>
                        </tr>
                        <tr>
                            <td>Pilihan Hari/Jam Kursus</td>
                            <td>
                                <select>
                                <option>Senin - Rabu / 09.00 - 11.00</option>
                                <option>Selasa - Kamis / 13.00 - 15.00</option>
                                <option>Sabtu - Minggu / 10.00 - 12.00</option>
                            </select>
                            </td>
                        </tr>
                    </table>
            </td>
        </tr>

        <tr bgcolor="#FA8072">
            <td colspan="2" style="padding-top:5px;">
                <span style="font-size:14px;"> Komentar Anda<br></span>
                <textarea cols="60" rows="5"></textarea>
                <br><br>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
                <input type="button" value="Cancel">
            </td>
        </tr>

    </table>
</body>

</html>
